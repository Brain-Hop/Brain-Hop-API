services:
  # Node-only API: suitable for Render Free because it has no local ML runtime.
  - type: web
    name: brain-hop-api
    env: docker
    # Points to root of Brain-Hop-API repo
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: FREE_MODEL
        value: openrouter/free
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
